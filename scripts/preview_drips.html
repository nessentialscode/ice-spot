<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #f0f2f5; font-family: sans-serif; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #333; }
    .ref-img { width: 100%; display: block; border: 1px solid #ddd; }
    .hero-mock {
      background: radial-gradient(circle at 50% 46%, #F46087 0%, #D83162 42%, #B51B47 75%, #6D0C27 100%);
      height: 120px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
    }
    .divider-wrap {
      width: 100%;
      height: 110px;
      background: white;
      margin-top: -1px;
    }
    .divider-wrap img, .divider-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>1. Reference Image from User:</h2>
    <img src="../assets/reference-drips.png" class="ref-img">
  </div>

  <div class="card">
    <h2>2. New SVG Divider (exact-ref-drips.svg):</h2>
    <div class="hero-mock">Hero Section Rose Pink</div>
    <div class="divider-wrap">
      <img src="../assets/exact-ref-drips.svg" alt="New SVG Drips">
    </div>
    <div style="padding: 30px; text-align: center; background: white;">
      <h3 style="margin:0; color:#444;">White Section Below</h3>
    </div>
  </div>

  <div class="card">
    <h2>3. Transparent Reference Drips PNG (drips-reference-transparent.png):</h2>
    <div class="hero-mock">Hero Section Rose Pink</div>
    <div class="divider-wrap">
      <img src="../assets/drips-reference-transparent.png" alt="Transparent Ref PNG">
    </div>
    <div style="padding: 30px; text-align: center; background: white;">
      <h3 style="margin:0; color:#444;">White Section Below</h3>
    </div>
  </div>
</body>
</html>
